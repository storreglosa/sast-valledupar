# Publica SOLO la carpeta tablero/ en GitHub Pages (decisión 26). Antes de desplegar:
# la guardia de publicación (sin borradores ni datos personales) y las pruebas del modelo en JS.
name: Publicar tablero en GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "tablero/**"
      - "tests/js/**"
      - "tests/fixtures/**"
      - "scripts/verificar_tablero.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guardia de publicación
        run: python scripts/verificar_tablero.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pruebas del modelo de tiempos, festivos y simulación
        run: node --test tests/js/*.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tablero
      - id: despliegue
        uses: actions/deploy-pages@v4
