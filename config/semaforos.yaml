# Intersecciones semaforizadas con SAST en operación (decisiones 27–29, Santiago, 2026-10-08).
#
# direccion     cómo se nombra el cruce en el tablero (Excel de equipos y mapas de inventario)
# archivo       reporte del controlador SISTRA en data/raw/semaforos/ (docs/ingesta.md). La fecha del
#               nombre es la de creación del PDF (corte de la programación): 26/08/2026 para los cuatro
#               que adjuntó el correo y 08/10/2026 para Universidad Área Andina (no venía en el correo).
# controlador   códigos que DEBE traer el reporte (p. 1): equipo controlador y cruce. Si no
#               coinciden, 09_semaforos.py se detiene (archivo cambiado o mal nombrado).
# solicitud     solicitud SAST del Excel de equipos; equipos = cámaras del punto.
# correo        nombre de la intersección en la tabla del correo del 29/09/2026 (null si no estaba).
# centro        nodos OSM cuyo promedio es el centro del cruce; `ejes` = vías (nomencla OSM) que forman
#               el eje norte–sur y el este–oeste de la codificación de accesos (decisión 30); el lado
#               (norte o sur, este u oeste) lo dan las cámaras SAST. `radio_conexion` (m, defecto 18):
#               distancia máxima al centro de una vía para contar como brazo. Lo valida Santiago.
# senalizacion  inventario de señalización de Santiago (mapas QGIS, 2026-10-08): cajón amarillo de no
#               bloqueo y cebras demarcadas que no tienen grupo peatonal (brazos según la codificación).
# nombres_via   nombre con que se rotula una vía cuando OSM no la nombra o la nombra distinto
#               (según los mapas de inventario de Santiago y el Excel de equipos).
# asignacion    grupo -> acceso / cebra validada por Santiago (decisión 28). Mientras falte, el
#               tablero no anima vehículos en ese cruce. Forma:
#                 asignacion: {validado_por: Santiago Torreglosa, fecha: 2026-10-08, desde_borrador: true,
#                              cambios: {G5: {movimiento: "...", acceso: norte, sale_por: oeste}}}
#               (desde_borrador = se adopta outputs/tables/semaforos_accesos_borrador.csv; `cambios`
#               corrige grupos puntuales).

intersecciones:
  - id: la-vina
    nombre: La Viña
    direccion: Carrera 9 con Calle 17
    archivo: 2026-08-26_sistra_planes-la-vina.pdf
    controlador: {equipo: "4254", cruce: "917"}
    solicitud: 5
    equipos: [EQUIPO051, EQUIPO052]
    correo: "La Viña – Cra. 9 con Calle 16B/17"
    centro: {nodos_osm: [986882742], nota: "CL 17 x KR 9, semáforo en OSM", ejes: {norte_sur: [KR 9], este_oeste: [CL 17]}}
    senalizacion: {cajon_amarillo: true, cebras_sin_semaforo: []}

  - id: mercado
    nombre: Mercado Público
    direccion: Calle 21 con Transversal 12
    archivo: 2026-08-26_sistra_planes-mercado.pdf
    controlador: {equipo: "4162", cruce: "2112"}
    solicitud: 3
    equipos: [EQUIPO031, EQUIPO032]
    correo: "Mercado – Calle 21 con Carrera 12"
    centro: {nodos_osm: [986877340, 986873694, 986879730, 986888586], nota: "CL 21 x KR 16 en OSM (calzadas dobles); la «Transversal 12» del EQUIPO032 son los tramos sin nombre al norte", ejes: {norte_sur: [KR 16, sin nombre], este_oeste: [CL 21]}}
    senalizacion: {cajon_amarillo: true, cebras_sin_semaforo: [oeste]}
    nombres_via: {"sin nombre": "Transversal 12"}

  - id: manguitos
    nombre: Los Manguitos
    direccion: Diagonal 21 con Carrera 19
    archivo: 2026-08-26_sistra_planes-manguitos.pdf
    controlador: {equipo: "4190", cruce: "1921"}
    solicitud: 2
    equipos: [EQUIPO021, EQUIPO022]
    correo: "Los Manguitos – Cra. 19 con Diagonal 21"
    centro: {nodos_osm: [986880618, 986889496, 986871555, 986885581], nota: "DG 21 x KR 19 (calzadas dobles); la KR 19 sigue al SE como vía local y la CL 21 sale al NE", ejes: {norte_sur: [DG 21], este_oeste: [KR 19]}, radio_conexion: 45}
    senalizacion: {cajon_amarillo: false, cebras_sin_semaforo: []}

  - id: loperena
    nombre: Colegio Loperena
    direccion: Carrera 12 con Diagonal 16
    archivo: 2026-08-26_sistra_planes-loperena.pdf
    controlador: {equipo: "4159", cruce: "1612"}
    solicitud: 4
    equipos: [EQUIPO041, EQUIPO042]
    correo: "Loperena – Cra. 12 con Calle 16"
    centro: {nodos_osm: [986880924, 7646982077, 986886670, 986873926], nota: "CL 16 / DG 21 (OSM) x KR 12, semáforo en OSM", ejes: {norte_sur: [KR 12], este_oeste: [CL 16, DG 21]}}
    senalizacion: {cajon_amarillo: true, cebras_sin_semaforo: [este]}
    nombres_via: {"DG 21": "Diagonal 16"}

  - id: area-andina
    nombre: Universidad Área Andina
    direccion: Carrera 23 con Calle 6
    archivo: 2026-10-08_sistra_planes-area-andina.pdf
    controlador: {equipo: "4255", cruce: "2306"}
    solicitud: 7
    equipos: [EQUIPO071]
    correo: null
    centro: {nodos_osm: [986872739, 986877534], nota: "CL 6 x KR 23 (calzada doble)", ejes: {norte_sur: [KR 23], este_oeste: [CL 6]}}
    senalizacion: {cajon_amarillo: true, cebras_sin_semaforo: [norte, este]}

# Hallazgos de nivel ERROR que Santiago decidió aceptar (no detienen 09_semaforos.py):
# - {interseccion: …, codigo: …, decision: "…", fecha: AAAA-MM-DD}
decisiones: []
